<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hyodo — Mobile home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;900&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#0A0A0A}a:hover{color:#6E6E6E}
</style>
</helmet>
<div style="width: 390px; min-height: 4560px; display: flex; flex-direction: column; background: #FFFFFF; color: #0A0A0A; font-family: 'Inter Tight', system-ui, sans-serif; overflow: hidden">

  <section aria-label="Showreel" style="position: relative; height: 720px; overflow: hidden; background: #000000; flex-shrink: 0">
    <div style="position: absolute; inset: 0">
      <sc-for list="{{reel}}" as="r" hint-placeholder-count="1">
        <img src="{{r.src}}" alt="" style="{{r.style}}">
      </sc-for>
    </div>
    <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; background: #000000; mix-blend-mode: multiply">
      <span style="display: block; color: #FFFFFF; font-weight: 900; font-size: 108px; letter-spacing: -0.06em; line-height: 0.8; white-space: nowrap">HYODO</span>
    </div>
    <header style="position: absolute; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 12px 8px 12px 16px">
      <a href="#" style="text-decoration: none; font-weight: 600; font-size: 13px; letter-spacing: 0.24em; color: #FFFFFF; padding: 12px 0">HYODO</a>
      <a href="MobileMenu.dc.html" aria-label="Open menu" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px">
        <svg width="22" height="12" viewBox="0 0 22 12" fill="none" stroke="#FFFFFF" stroke-width="1.5" aria-hidden="true"><path d="M0 1 H22 M0 11 H22"></path></svg>
      </a>
    </header>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; justify-content: space-between; gap: 12px; padding: 20px 16px; color: #FFFFFF; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase">
      <span>Led by story. Crafted to last.</span>
      <span>Scroll ↓</span>
    </div>
  </section>

  <section id="work" style="padding: 56px 0 24px">
    <div style="display: flex; flex-direction: column; gap: 20px; padding: 0 16px 20px; border-bottom: 1px solid #0A0A0A; margin: 0 16px; padding-left: 0; padding-right: 0">
      <h2 style="margin: 0; font-size: 48px; font-weight: 600; letter-spacing: -0.045em; line-height: 0.9">Selected work</h2>
      <div role="group" aria-label="Filter by category" style="display: flex; gap: 6px; overflow-x: auto; margin-right: -16px; padding-right: 16px">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
          <button type="button" onClick="{{ f.pick }}" style="{{f.style}}">{{f.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 48px; padding-top: 24px">
      <sc-for list="{{projects}}" as="p" hint-placeholder-count="3">
        <article style="display: flex; flex-direction: column; gap: 14px">
          <a href="MobileProject.dc.html" aria-label="Open {{p.title}}" style="position: relative; display: block; width: 100%; aspect-ratio: 4 / 5; overflow: hidden; background: #0A0A0A">
            <img src="{{p.src}}" alt="Still from {{p.title}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
          </a>
          <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 16px">
            <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
              <h3 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.035em; line-height: 0.95">{{p.title}}</h3>
              <p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6E6E"><span aria-hidden="true" style="display: inline-block; width: 7px; height: 7px; background: #8A1414"></span><span><span style="color: #8A1414">{{p.cat}}</span> / {{p.name}}</span></p>
            </div>
            <span style="font-size: 11px; font-variant-numeric: tabular-nums; letter-spacing: 0.08em; color: #6E6E6E">{{p.counter}}</span>
          </div>
        </article>
      </sc-for>
    </div>
  </section>

  <footer style="margin-top: auto; background: #FFFFFF; color: #0A0A0A">
    <div style="padding: 48px 16px 24px; display: flex; flex-direction: column; gap: 40px; border-top: 1px solid #0A0A0A; margin-top: 32px">
      <a href="#" aria-label="Hyodo Productions — back to top" style="text-decoration: none; font-weight: 900; font-size: 88px; letter-spacing: -0.065em; line-height: 0.8">hyodo</a>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; font-size: 15px">
        <nav aria-label="Footer menu" style="display: flex; flex-direction: column">
          <span style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6E6E; padding-bottom: 4px">Menu</span>
          <a href="#work" style="text-decoration: none; padding: 11px 0">Work</a>
          <a href="MobileAbout.dc.html" style="text-decoration: none; padding: 11px 0">About</a>
          <a href="MobileContact.dc.html" style="text-decoration: none; padding: 11px 0">Contact</a>
        </nav>
        <div style="display: flex; flex-direction: column; min-width: 0">
          <span style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6E6E; padding-bottom: 4px">Connect</span>
          <a href="mailto:hello@hyodoproductions.com" style="text-decoration: none; padding: 11px 0; overflow-wrap: anywhere">hello@hyodoproductions.com</a>
          <a href="https://www.instagram.com/hyodoproductions/" style="text-decoration: none; padding: 11px 0">Instagram</a>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #E2E2E2; padding-top: 20px; font-size: 12px; color: #6E6E6E">
        <span>© 2026 Hyodo Productions — Led by story. Crafted to last.</span>
        <span>Los Angeles / Worldwide</span>
      </div>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":4560}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._tick = setInterval(() => {
      this.setState({ frame: ((this.state && this.state.frame) || 0) + 1 });
    }, 1400);
  }
  componentWillUnmount() {
    clearInterval(this._tick);
  }
  renderVals() {
    const s = this.state || {};
    const all = [
      { title: 'Movement in Mind', name: 'Grammicci', cat: 'Commercial', src: '/_blob/b7bdb04ef1773b1e4f6192090e9d8dae' },
      { title: 'Telekinesis', name: 'Andy Chung', cat: 'Music Video', src: '/_blob/d9fbb501afbbc78e92123e8a3b2d9ba8' },
      { title: 'AI Responsibly', name: 'Optro', cat: 'Commercial', src: '/_blob/05282a25c3c38d7aa34c8bf4ac88a2bd' },
      { title: 'Notes on the Divide', name: 'Phinehas Yoon', cat: 'Short Film', src: '/_blob/ca95fa936c2221852e02771d09f2bb6c' },
      { title: 'Life Support', name: 'Dr. Andy Chu', cat: 'Short Film', src: '/_blob/a985cf569809b57646ee6d97fbe5dfb3' }
    ];
    const cur = (s.frame || 0) % all.length;
    const reel = all.map((x, i) => ({
      src: x.src,
      style: 'position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 600ms ease; opacity: ' + (i === cur ? 1 : 0)
    }));
    const filter = s.filter || 'All';
    const list = filter === 'All' ? all : all.filter((x) => x.cat === filter);
    const pad = (n) => String(n).padStart(2, '0');
    const projects = list.map((x, i) => ({ ...x, counter: pad(i + 1) + ' / ' + pad(list.length) }));
    const base = 'flex-shrink: 0; min-height: 44px; padding: 0 16px; border-radius: 0; font: inherit; font-size: 14px; white-space: nowrap; cursor: pointer; ';
    const filters = ['All', 'Commercial', 'Music Video', 'Short Film'].map((f) => ({
      label: f,
      pick: () => this.setState({ filter: f }),
      style: base + (f === filter
        ? 'background: #0A0A0A; color: #FFFFFF; border: 1px solid #0A0A0A'
        : 'background: #FFFFFF; color: #0A0A0A; border: 1px solid #D0D0D0')
    }));
    return { reel, projects, filters };
  }
}
</script>
</body>
</html>
